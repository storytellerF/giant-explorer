name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run detekt
        run: ./gradlew detekt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Compile app and build GEP plugins
        run: |
          ./gradlew :app:compileDebugKotlin \
            :plugins:li:li-plugin:packGep \
            :plugins:yue:yue-plugin:packGep

      - name: Validate GEP contents
        run: |
          for gep in \
            plugins/li/li-plugin/build/outputs/gep/li.gep \
            plugins/yue/yue-plugin/build/outputs/gep/yue.gep; do
            unzip -l "$gep" | grep -q 'classes.dex'
            unzip -l "$gep" | grep -q 'META-INF/giant-explorer-plugin.ini'
          done
          unzip -l plugins/yue/yue-plugin/build/outputs/gep/yue.gep | grep 'resources.arsc'
