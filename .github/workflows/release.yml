name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-app:
    name: Build App
    runs-on: ubuntu-latest
    env:
      storyteller_f_sign_path: ${{ github.workspace }}/signing_key.jks
      storyteller_f_sign_alias: ${{ secrets.ALIAS }}
      storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
      storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$storyteller_f_sign_path"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: giant-explorer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-plugins:
    name: Build Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Build GEP plugins
        run: ./gradlew :plugins:li:li-plugin:packGep :plugins:yue:yue-plugin:packGep

      - name: Build yue-html
        run: bash plugins/yue-html/dispatch.sh

      - name: Upload li plugin
        uses: actions/upload-artifact@v7
        with:
          name: li-plugin-release
          path: plugins/li/li-plugin/build/outputs/gep/li.gep
          if-no-files-found: error

      - name: Upload yue plugin
        uses: actions/upload-artifact@v7
        with:
          name: yue-plugin-release
          path: plugins/yue/yue-plugin/build/outputs/gep/yue.gep
          if-no-files-found: error

      - name: Upload yue-html
        uses: actions/upload-artifact@v7
        with:
          name: yue-html-release
          path: build/yue-html/*.zip
          if-no-files-found: error

  publish:
    name: Publish to Maven
    runs-on: ubuntu-latest
    needs: [build-app, build-plugins]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        if: success()
        run: ./gradlew :giant-explorer-plugin-core:publishToMavenCentral -Pversion="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
